repos:
  # Local hooks only — no python venv bootstrap. The pre-commit-hooks
  # repo was dropped because its virtualenv install broke on systems
  # where python3.14 and libexpat are out of sync.
  - repo: local
    hooks:
      - id: swift-format-lint
        name: swift-format lint (optional; install via `brew install swift-format`)
        entry: bash -c 'command -v swift-format >/dev/null 2>&1 || exit 0; exec swift-format lint --recursive Sources'
        language: system
        pass_filenames: false
        files: '\.swift$'

      - id: swift-build
        name: swift build
        entry: swift build
        language: system
        pass_filenames: false
        files: '\.(swift|Package\.swift)$'
