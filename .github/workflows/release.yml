name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    env:
      TAP_OWNER: cristim
      TAP_REPO: homebrew-tap
      FORMULA_NAME: killwindow
    steps:
      - uses: actions/checkout@v4

      - name: Build release binary
        run: swift build -c release

      - name: Wrap binary in a signed .app bundle
        run: make app

      - name: Package tarball
        id: pack
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/v}"
          STAGE="killwindow-${VERSION}"
          TARBALL="killwindow-${VERSION}-macos.tar.gz"

          # Wrap killwindow.app in a versioned directory. Homebrew's
          # default stage auto-cd's into a single top-level entry of
          # the tarball — without this wrapper it would cd into the
          # .app itself, and the formula's prefix.install call would
          # fail to locate 'killwindow.app'.
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp -R build/killwindow.app "$STAGE/"
          tar -czf "$TARBALL" "$STAGE"
          rm -rf "$STAGE"

          SHA=$(shasum -a 256 "$TARBALL" | awk '{print $1}')
          {
            echo "version=$VERSION"
            echo "sha256=$SHA"
            echo "tarball=$TARBALL"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.pack.outputs.version }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          set -euo pipefail
          gh release create "v${VERSION}" "${TARBALL}" \
            --title "v${VERSION}" --generate-notes

      - name: Update Homebrew cask in tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          VERSION:   ${{ steps.pack.outputs.version }}
          SHA256:    ${{ steps.pack.outputs.sha256 }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_OWNER}/${TAP_REPO}.git" tap
          cd tap

          # Move from formula → cask distribution. Remove any stale formula
          # file so `brew install cristim/tap/killwindow` resolves to the
          # cask (casks live in Casks/, formulas in Formula/).
          rm -f "Formula/${FORMULA_NAME}.rb"
          mkdir -p Casks
          cat > "Casks/${FORMULA_NAME}.rb" <<EOF
          cask "killwindow" do
            version "${VERSION}"
            sha256 "${SHA256}"

            url "https://github.com/${TAP_OWNER}/killwindow/releases/download/v#{version}/killwindow-#{version}-macos.tar.gz"
            name "killwindow"
            desc "Click a window to kill its owning process (macOS xkill)"
            homepage "https://github.com/${TAP_OWNER}/killwindow"

            app "killwindow.app"
            binary "#{appdir}/killwindow.app/Contents/MacOS/killwindow"

            uninstall launchctl: "com.cristim.killwindow"

            zap trash: [
              "~/Library/Application Support/killwindow",
              "~/Library/LaunchAgents/com.cristim.killwindow.plist",
              "/tmp/killwindow.log",
            ]

            caveats <<~CAVEATS
              killwindow — click a window to kill it.

              One-off from terminal:
                killwindow                      # click to SIGTERM
                killwindow -h                   # full help

              Grant Accessibility and enable the background hotkey
              daemon (default ⌃⌥⌘K):
                killwindow setup
                killwindow setup --enable-daemon

              The Accessibility grant persists across upgrades because the
              .app's bundle ID (com.cristim.killwindow) stays constant.
            CAVEATS
          end
          EOF
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "killwindow ${VERSION}"
          git push
